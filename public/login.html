<form id="form-login">
    <input type="email" id="correo" placeholder="Correo" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button type="submit">Iniciar Sesión</button>
</form>

<script>
    // Ejemplo de tu función de login en el front-end
async function manejarLogin(evento) {
    evento.preventDefault(); // Evita que la página se recargue

    const credenciales = {
        correo: document.getElementById('correo').value,
        password: document.getElementById('password').value
    };

    const response = await fetch('https://api-opticonstruct-nodejs-18k4.onrender.com/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(credenciales)
    });

    const data = await response.json();

    if (response.ok) {
        // --- AQUÍ ES DONDE PONES LA LÍNEA ---
        localStorage.setItem('token', data.token); 
        
        alert('Login exitoso');
        // Rediriges a tu página principal donde está la tabla
        window.location.href = 'index.html'; 
    } else {
        alert('Error: ' + data.mensaje);
    }
}

    async function manejarLogin(evento) {
        evento.preventDefault();
        // ... (todo el código que ya tienes)
        if (response.ok) {
            localStorage.setItem('token', data.token); // ¡Aquí se guarda!
            window.location.href = 'index.html'; 
        }
    }

    // 2. Aquí conectas el formulario con la función
    const formulario = document.getElementById('form-login');
    formulario.addEventListener('submit', manejarLogin);
</script>
