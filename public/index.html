<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Opticonstruct - Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Lista de Materiales en Sucursal</h1>
    
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Precio Base</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="tabla-materiales">
            </tbody>
    </table>

    <script>
        // URL de tu API en Render
        const API_URL = 'https://api-opticonstruct-nodejs-18k4.onrender.com/api/material_sucursal';
        
        async function obtenerMateriales() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const cuerpoTabla = document.getElementById('tabla-materiales');
                cuerpoTabla.innerHTML = ''; // Limpiar tabla
                
                data.forEach(item => {
                    cuerpoTabla.innerHTML += `
                        <tr>
                            <td>${item.Nombre_M}</td>
                            <td>$${item.PrecioBase}</td>
                            <td>${item.Cantidad}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }
        obtenerMateriales();
    </script>
</body>
</html>
