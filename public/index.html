<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Opticonstruct - Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Lista de Materiales en Sucursal</h1>
    
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Precio Base</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="tabla-materiales">
            </tbody>
    </table>

    <script>
    const API_URL = 'https://api-opticonstruct-nodejs-18k4.onrender.com/api/material_sucursal';

    async function cargarMateriales() {
        // Recuperamos el token que guardamos al hacer login
        const token = localStorage.getItem('token');

        if (!token) {
            console.error('No hay token, redirigiendo al login...');
            // window.location.href = '/login.html'; // Descomenta esto si tienes una página de login
            return;
        }

        try {
            const response = await fetch(API_URL, {
                headers: { 
                    'Authorization': `Bearer ${token}` 
                }
            });

            if (response.status === 401) {
                alert('Sesión expirada o token inválido');
                return;
            }

            const materiales = await response.json();
            const lista = document.getElementById('lista-materiales');
            lista.innerHTML = ''; // Limpiar antes de cargar

            materiales.forEach(m => {
                let li = document.createElement('li');
                li.innerText = `${m.Nombre_M} - Precio: $${m.PrecioBase}`;
                lista.appendChild(li);
            });
        } catch (error) {
            console.error('Error al cargar materiales:', error);
        }
    }

    cargarMateriales();
</script>
</body>
</html>
