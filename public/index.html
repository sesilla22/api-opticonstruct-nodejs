<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Opticonstruct - Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Lista de Materiales en Sucursal</h1>
    
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Precio Base</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="lista-materiales"> 
        </tbody>
    </table>

    <script>
    const API_URL = 'https://api-opticonstruct-nodejs-18k4.onrender.com/api/material_sucursal';

    async function cargarMateriales() {
        const token = localStorage.getItem('token');

        // Nota: Si estás en modo presentación (MODO_DEMO = true), 
        // puedes comentar este if para que no te pida token.
        if (!token) {
            console.warn('No hay token, intentando cargar sin autenticación...');
        }

        try {
            const response = await fetch(API_URL, {
                headers: { 
                    'Authorization': token ? `Bearer ${token}` : '' 
                }
            });

            if (response.status === 401) {
                alert('Sesión expirada o token inválido');
                return;
            }

            const materiales = await response.json();
            const tablaCuerpo = document.getElementById('lista-materiales');
            tablaCuerpo.innerHTML = ''; // Limpiar antes de cargar

            // AQUÍ CORREGIMOS EL FOREACH PARA QUE PINTE FILAS EN LA TABLA
            materiales.forEach(m => {
                let fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${m.Nombre_M}</td>
                    <td>$${m.PrecioBase}</td>
                    <td>${m.Cantidad}</td>
                `;
                tablaCuerpo.appendChild(fila);
            });
        } catch (error) {
            console.error('Error al cargar materiales:', error);
            alert('Error al conectar con el servidor');
        }
    }

    cargarMateriales();
    </script>
</body>
</html>
